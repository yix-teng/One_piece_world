<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a3d62" />
<title>Grand Line Explorer — One Piece</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a3d62;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1a6fb0 0%, #0a3d62 60%, #06263d 100%);
    color: #fff; text-align: center; transition: opacity .6s ease;
  }
  #loader h1 { font-size: 8vw; letter-spacing: 2px; text-shadow: 0 3px 0 #c0392b, 0 6px 10px rgba(0,0,0,.4); }
  #loader p { margin-top: 12px; font-size: 4vw; opacity: .85; }
  .hat { width: 28vw; height: 28vw; margin-bottom: 4vw; position: relative; animation: bob 2s ease-in-out infinite; }
  .hat .brim { position:absolute; bottom: 18%; left:0; width:100%; height:30%; background:#f4d03f; border-radius:50%; box-shadow: inset 0 -6px 0 rgba(0,0,0,.15); }
  .hat .crown { position:absolute; bottom:30%; left:25%; width:50%; height:48%; background:#f4d03f; border-radius:45% 45% 35% 35%; }
  .hat .band { position:absolute; bottom:34%; left:25%; width:50%; height:10%; background:#c0392b; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-8px) rotate(4deg)} }
  .bar { width: 60vw; max-width: 320px; height: 10px; background: rgba(255,255,255,.2); border-radius: 6px; overflow:hidden; margin-top: 6vw; }
  .bar > i { display:block; height:100%; width:0; background: linear-gradient(90deg,#f4d03f,#e67e22); transition: width .3s; }

  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #banner {
    position: absolute; top: calc(env(safe-area-inset-top,0) + 12px); left: 50%; transform: translateX(-50%);
    background: rgba(6,38,61,.55); color:#fff; padding: 8px 18px; border-radius: 20px;
    font-size: 15px; font-weight: bold; letter-spacing:.5px; backdrop-filter: blur(4px);
    border: 1px solid rgba(244,208,63,.5); white-space: nowrap;
  }
  #banner small { display:block; font-weight: normal; font-size: 11px; opacity:.8; text-align:center; }
  #toast {
    position: absolute; top: 22%; left: 50%; transform: translateX(-50%) scale(.9);
    background: rgba(192,57,43,.92); color:#fff; padding: 10px 20px; border-radius: 14px;
    font-weight: bold; font-size: 16px; opacity: 0; transition: opacity .3s, transform .3s;
    border: 2px solid #f4d03f; text-align:center; max-width: 80vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #score {
    position: absolute; top: calc(env(safe-area-inset-top,0) + 12px); right: 12px;
    background: rgba(6,38,61,.55); color:#f4d03f; padding: 8px 14px; border-radius: 14px;
    font-weight:bold; font-size: 15px; border:1px solid rgba(244,208,63,.5);
    display:flex; align-items:center; gap:6px;
  }

  #joy {
    position: fixed; z-index: 20; width: 150px; height: 150px;
    left: 24px; bottom: calc(env(safe-area-inset-bottom,0) + 28px);
    border-radius: 50%; touch-action: none;
    background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border: 2px solid rgba(255,255,255,.25); opacity: .85;
  }
  #joy .ring { position:absolute; inset: 14px; border-radius:50%; border: 2px dashed rgba(244,208,63,.45); }
  #joy .arrow { position:absolute; color: rgba(244,208,63,.7); font-size: 16px; font-weight:bold; }
  #joy .up{ top:6px; left:50%; transform:translateX(-50%);}
  #joy .dn{ bottom:6px; left:50%; transform:translateX(-50%);}
  #joy .lf{ left:8px; top:50%; transform:translateY(-50%);}
  #joy .rt{ right:8px; top:50%; transform:translateY(-50%);}
  #stick {
    position:absolute; width: 64px; height: 64px; left: 43px; top: 43px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffe98a, #e67e22);
    box-shadow: 0 4px 10px rgba(0,0,0,.4), inset 0 2px 4px rgba(255,255,255,.5);
    border: 2px solid #c0392b; transition: transform .05s;
  }

  .btn {
    position: fixed; z-index: 20; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#fff; font-weight:bold; touch-action:none; user-select:none;
    box-shadow: 0 5px 14px rgba(0,0,0,.4), inset 0 2px 6px rgba(255,255,255,.3);
    border: 2px solid rgba(255,255,255,.35); line-height:1.05;
  }
  .btn:active { transform: scale(.93); }
  #runBtn { right: 26px; bottom: calc(env(safe-area-inset-bottom,0) + 120px); width: 86px; height: 86px; font-size: 15px; background: radial-gradient(circle at 35% 30%, #ff6b6b, #c0392b); }
  #jumpBtn { right: 120px; bottom: calc(env(safe-area-inset-bottom,0) + 44px); width: 76px; height: 76px; font-size: 14px; background: radial-gradient(circle at 35% 30%, #5dade2, #21618c); }

  #errbox {
    display:none; position:fixed; z-index:999; left:8px; right:8px; top:64px;
    background:rgba(140,0,0,.92); color:#fff; font:12px/1.4 ui-monospace,monospace;
    padding:10px 12px; border-radius:10px; white-space:pre-wrap; word-break:break-word;
    border:1px solid #ff6b6b; max-height:50vh; overflow:auto;
  }
  #errbox b { color:#ffd23f; }
</style>
</head>
<body>
<div id="app"></div>
<div id="errbox"></div>

<div id="loader">
  <div class="hat"><div class="crown"></div><div class="band"></div><div class="brim"></div></div>
  <h1>GRAND LINE</h1>
  <p>Explorer · A One Piece Adventure</p>
  <div class="bar"><i id="barfill"></i></div>
  <p style="margin-top:5vw;font-size:3.4vw;opacity:.7">Loading the seas…</p>
</div>

<div id="hud">
  <div id="banner">⚓ GRAND LINE EXPLORER<small id="hint">Use the D-Pad to walk · explore the island</small></div>
  <div id="score">🪙 <span id="coins">0</span> / <span id="total">0</span></div>
  <div id="toast"></div>
</div>

<div id="joy">
  <div class="ring"></div>
  <div class="arrow up">▲</div><div class="arrow dn">▼</div>
  <div class="arrow lf">◄</div><div class="arrow rt">►</div>
  <div id="stick"></div>
</div>
<div id="runBtn" class="btn">DASH</div>
<div id="jumpBtn" class="btn">JUMP</div>

<!-- on-screen error reporter (so a failure never shows just a blank screen) -->
<script>
  window.__err = function(label, msg){
    var b = document.getElementById('errbox');
    if(!b) return;
    b.style.display = 'block';
    b.innerHTML += '<b>'+label+':</b> ' + String(msg).replace(/</g,'&lt;') + '\n';
  };
  window.addEventListener('error', function(e){
    window.__err('ERROR', (e.message||e.type) + (e.filename ? (' @'+String(e.filename).split('/').pop()+':'+e.lineno) : ''));
  });
  window.addEventListener('unhandledrejection', function(e){
    window.__err('PROMISE', (e.reason && e.reason.message) || e.reason);
  });
</script>

<!-- three.js vendored locally: no CDN, no ES modules, works offline -->
<script src="vendor/three.min.js"></script>

<script>
/* ============================================================
   GRAND LINE EXPLORER — a fan-made One Piece 3D walking sim
   Portrait mobile · 3rd person · floating D-Pad
   Built procedurally with three.js (global build).
   ============================================================ */
(function(){
  if (typeof THREE === 'undefined'){
    window.__err('FATAL', 'three.js failed to load (vendor/three.min.js). Check the file exists.');
    return;
  }

  var loaderEl = document.getElementById('loader');
  var barfill  = document.getElementById('barfill');
  var prog = 0;
  var fakeLoad = setInterval(function(){ prog = Math.min(95, prog + Math.random()*18); barfill.style.width = prog+'%'; }, 120);

  // ---------- Renderer ----------
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  } catch(e){
    window.__err('FATAL', 'WebGL not available on this browser: ' + e.message);
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('app').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x9fd3e8, 60, 260);

  // gradient sky background (canvas texture — no custom shaders, mobile-safe)
  (function(){
    var c = document.createElement('canvas'); c.width = 16; c.height = 256;
    var g = c.getContext('2d');
    var grad = g.createLinearGradient(0,0,0,256);
    grad.addColorStop(0, '#2d7fd6'); grad.addColorStop(0.55, '#7ec3ec'); grad.addColorStop(1, '#cdeffd');
    g.fillStyle = grad; g.fillRect(0,0,16,256);
    var tex = new THREE.CanvasTexture(c);
    if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
    scene.background = tex;
  })();

  var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ---------- Lights ----------
  scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4d6b3a, 0.9));
  var sun = new THREE.DirectionalLight(0xfff2cc, 1.25);
  sun.position.set(40, 70, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  var sc = 90;
  sun.shadow.camera.left=-sc; sun.shadow.camera.right=sc; sun.shadow.camera.top=sc; sun.shadow.camera.bottom=-sc;
  sun.shadow.camera.near=1; sun.shadow.camera.far=220; sun.shadow.bias=-0.0005;
  scene.add(sun); scene.add(sun.target);

  // ---------- Clouds ----------
  var cloudMat = new THREE.MeshStandardMaterial({color:0xffffff, transparent:true, opacity:.9, roughness:1});
  for (var i=0;i<12;i++){
    var cg = new THREE.Group();
    var n = 3 + Math.floor(Math.random()*3);
    for (var j=0;j<n;j++){
      var s = 6 + Math.random()*8;
      var m = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), cloudMat);
      m.position.set(j*7-7+Math.random()*4, Math.random()*3, Math.random()*5);
      cg.add(m);
    }
    cg.position.set((Math.random()-.5)*420, 70+Math.random()*40, (Math.random()-.5)*420);
    cg.scale.setScalar(.8+Math.random());
    scene.add(cg);
  }

  // ---------- Ocean ----------
  var oceanGeo = new THREE.PlaneGeometry(1000, 1000, 60, 60);
  oceanGeo.rotateX(-Math.PI/2);
  var ocean = new THREE.Mesh(oceanGeo, new THREE.MeshStandardMaterial({ color:0x1f8bd1, roughness:.35, metalness:.15, transparent:true, opacity:.95 }));
  ocean.position.y = -0.4; ocean.receiveShadow = true; scene.add(ocean);
  var oBase = oceanGeo.attributes.position.array.slice();

  // ---------- Island ----------
  var ISLAND_R = 70;
  var world = new THREE.Group(); scene.add(world);

  var sand = new THREE.Mesh(new THREE.CylinderGeometry(ISLAND_R, ISLAND_R+8, 6, 48), new THREE.MeshStandardMaterial({color:0xf2dca0, roughness:1}));
  sand.position.y = -2.0; sand.receiveShadow = true; world.add(sand);

  var grassGeo = new THREE.CircleGeometry(ISLAND_R-6, 64);
  grassGeo.rotateX(-Math.PI/2);
  var gpos = grassGeo.attributes.position;
  for (var gi=0; gi<gpos.count; gi++){
    var gx=gpos.getX(gi), gz=gpos.getZ(gi); var gd=Math.sqrt(gx*gx+gz*gz);
    var gy = Math.sin(gx*0.06)*Math.cos(gz*0.06)*1.6 + Math.sin(gd*0.15)*0.6;
    if (gd>ISLAND_R-14) gy *= (ISLAND_R-6-gd)/8;
    gpos.setY(gi, Math.max(0,gy));
  }
  grassGeo.computeVertexNormals();
  var grass = new THREE.Mesh(grassGeo, new THREE.MeshStandardMaterial({color:0x57b94a, roughness:1}));
  grass.position.y = 0.2; grass.receiveShadow = true; world.add(grass);

  function groundHeight(x,z){
    var d=Math.sqrt(x*x+z*z);
    var y = Math.sin(x*0.06)*Math.cos(z*0.06)*1.6 + Math.sin(d*0.15)*0.6;
    if (d>ISLAND_R-14) y *= Math.max(0,(ISLAND_R-6-d)/8);
    return 0.2 + Math.max(0,y);
  }

  var colliders = [];
  function addCollider(x,z,r){ colliders.push({x:x,z:z,r:r}); }

  // palms
  function palm(x,z){
    var g = new THREE.Group();
    var h = 7+Math.random()*3;
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.6,h,8), new THREE.MeshStandardMaterial({color:0x9c6b3f, roughness:1}));
    trunk.position.y=h/2; trunk.castShadow=true; trunk.rotation.z=(Math.random()-.5)*0.2; g.add(trunk);
    var leafMat = new THREE.MeshStandardMaterial({color:0x2f9e44, roughness:1, side:THREE.DoubleSide});
    for (var i=0;i<7;i++){
      var leaf = new THREE.Mesh(new THREE.SphereGeometry(2.4,8,6,0,Math.PI*2,0,Math.PI/2), leafMat);
      leaf.scale.set(1,.3,2.6); leaf.position.y=h; leaf.rotation.y=i/7*Math.PI*2; leaf.rotation.z=-0.5; leaf.castShadow=true; g.add(leaf);
    }
    var cocoMat = new THREE.MeshStandardMaterial({color:0x5a3d23});
    for (var k=0;k<3;k++){ var c=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),cocoMat); c.position.set(Math.cos(k)*.6,h-.6,Math.sin(k)*.6); g.add(c); }
    g.position.set(x, groundHeight(x,z), z);
    world.add(g); addCollider(x,z,1.0);
  }
  for (var p=0;p<24;p++){ var pa=Math.random()*Math.PI*2, pr=10+Math.random()*(ISLAND_R-20); palm(Math.cos(pa)*pr, Math.sin(pa)*pr); }

  // rocks & bushes
  var rockMat = new THREE.MeshStandardMaterial({color:0x8a8d91, roughness:1});
  for (var r1=0;r1<14;r1++){
    var ra=Math.random()*Math.PI*2, rr=8+Math.random()*(ISLAND_R-18);
    var rx=Math.cos(ra)*rr, rz=Math.sin(ra)*rr, rs=1+Math.random()*2.2;
    var rk=new THREE.Mesh(new THREE.DodecahedronGeometry(rs,0), rockMat);
    rk.position.set(rx, groundHeight(rx,rz)+rs*0.4, rz); rk.rotation.set(Math.random(),Math.random(),Math.random());
    rk.castShadow=true; rk.receiveShadow=true; world.add(rk); addCollider(rx,rz,rs*0.7);
  }
  var bushMat = new THREE.MeshStandardMaterial({color:0x3f8f33, roughness:1});
  for (var b1=0;b1<26;b1++){
    var ba=Math.random()*Math.PI*2, br=8+Math.random()*(ISLAND_R-16);
    var bx=Math.cos(ba)*br, bz=Math.sin(ba)*br, bs=.8+Math.random()*1.2;
    var bu=new THREE.Mesh(new THREE.IcosahedronGeometry(bs,0), bushMat);
    bu.position.set(bx, groundHeight(bx,bz)+bs*0.5, bz); bu.castShadow=true; world.add(bu);
  }

  // houses
  function house(x,z,col){
    var g=new THREE.Group();
    var base=new THREE.Mesh(new THREE.BoxGeometry(6,4,6), new THREE.MeshStandardMaterial({color:col,roughness:1}));
    base.position.y=2; base.castShadow=true; base.receiveShadow=true; g.add(base);
    var roof=new THREE.Mesh(new THREE.ConeGeometry(5,3,4), new THREE.MeshStandardMaterial({color:0xb03a2e,roughness:1}));
    roof.position.y=5.5; roof.rotation.y=Math.PI/4; roof.castShadow=true; g.add(roof);
    var door=new THREE.Mesh(new THREE.BoxGeometry(1.4,2.4,.2), new THREE.MeshStandardMaterial({color:0x6b3d1f}));
    door.position.set(0,1.2,3.05); g.add(door);
    g.position.set(x, groundHeight(x,z), z); g.rotation.y=Math.random()*Math.PI*2;
    world.add(g); addCollider(x,z,4.2);
  }
  house(-30,-18,0xf6e6c8); house(-38,-8,0xe8d2a8); house(-26,-30,0xf0dcb8);

  // windmill
  var windmillHub = null;
  (function(){
    var x=-44,z=-22; var g=new THREE.Group();
    var tower=new THREE.Mesh(new THREE.CylinderGeometry(2.4,3.2,11,12), new THREE.MeshStandardMaterial({color:0xf4ead0,roughness:1}));
    tower.position.y=5.5; tower.castShadow=true; g.add(tower);
    var cap=new THREE.Mesh(new THREE.ConeGeometry(3,2.4,12), new THREE.MeshStandardMaterial({color:0xb03a2e}));
    cap.position.y=12; g.add(cap);
    var hub=new THREE.Group(); hub.position.set(0,9,3.2);
    var bladeMat=new THREE.MeshStandardMaterial({color:0xffffff,side:THREE.DoubleSide,roughness:1});
    for (var i=0;i<4;i++){ var bl=new THREE.Mesh(new THREE.PlaneGeometry(1.6,6),bladeMat); bl.geometry.translate(0,3.2,0); bl.rotation.z=i*Math.PI/2; hub.add(bl); }
    g.add(hub); g.position.set(x,groundHeight(x,z),z); world.add(g); addCollider(x,z,3.4);
    windmillHub = hub;
  })();

  // lighthouse
  (function(){
    var x=46,z=42; var g=new THREE.Group();
    var body=new THREE.Mesh(new THREE.CylinderGeometry(2,3,16,16), new THREE.MeshStandardMaterial({color:0xffffff,roughness:1}));
    body.position.y=8; body.castShadow=true; g.add(body);
    for (var i=0;i<3;i++){ var rr=new THREE.Mesh(new THREE.CylinderGeometry(2.1+0.33*(2-i),2.6+0.33*(2-i),2,16),new THREE.MeshStandardMaterial({color:0xc0392b})); rr.position.y=2+i*5.3; g.add(rr); }
    var lamp=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.4,12), new THREE.MeshStandardMaterial({color:0xffe066,emissive:0xffcc33,emissiveIntensity:1}));
    lamp.position.y=17.2; g.add(lamp);
    g.position.set(x,groundHeight(x,z),z); world.add(g); addCollider(x,z,3.2);
  })();

  // Thousand Sunny (stylized)
  (function(){
    var g=new THREE.Group();
    var hullMat=new THREE.MeshStandardMaterial({color:0xc0843f,roughness:.8});
    var hull=new THREE.Mesh(new THREE.CylinderGeometry(5,3.4,22,16,1,false,0,Math.PI), hullMat);
    hull.rotation.z=Math.PI/2; hull.rotation.y=Math.PI/2; hull.scale.set(1,1,.55); hull.position.y=2.4; hull.castShadow=true; g.add(hull);
    var deck=new THREE.Mesh(new THREE.BoxGeometry(20,.6,7), new THREE.MeshStandardMaterial({color:0xe0b070})); deck.position.y=3.6; deck.castShadow=true; g.add(deck);
    var lion=new THREE.Mesh(new THREE.SphereGeometry(2,16,12), new THREE.MeshStandardMaterial({color:0xf1c40f}));
    lion.position.set(11,4.4,0); lion.scale.set(1,1,1.1); g.add(lion);
    var mane=new THREE.Mesh(new THREE.TorusGeometry(2.4,.7,8,16), new THREE.MeshStandardMaterial({color:0xe67e22}));
    mane.position.set(10.4,4.4,0); mane.rotation.y=Math.PI/2; g.add(mane);
    var mast=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,18,8), new THREE.MeshStandardMaterial({color:0x7a4a22})); mast.position.set(-1,12,0); g.add(mast);
    var sail=new THREE.Mesh(new THREE.PlaneGeometry(11,9), new THREE.MeshStandardMaterial({color:0xffffff,side:THREE.DoubleSide,roughness:1})); sail.position.set(-1,12,0); g.add(sail);
    var cv=document.createElement('canvas'); cv.width=cv.height=256; var cx=cv.getContext('2d');
    cx.clearRect(0,0,256,256);
    cx.fillStyle='#111'; cx.beginPath(); cx.arc(128,118,46,0,7); cx.fill();
    cx.fillRect(96,150,64,40);
    cx.fillStyle='#f4d03f'; cx.beginPath(); cx.ellipse(128,150,88,18,0,0,7); cx.fill();
    cx.fillStyle='#c0392b'; cx.fillRect(70,146,116,10);
    cx.fillStyle='#fff'; cx.beginPath(); cx.arc(112,112,12,0,7); cx.arc(146,112,12,0,7); cx.fill();
    cx.strokeStyle='#111'; cx.lineWidth=12;
    cx.beginPath(); cx.moveTo(70,205); cx.lineTo(186,235); cx.moveTo(186,205); cx.lineTo(70,235); cx.stroke();
    var tex=new THREE.CanvasTexture(cv);
    var flag=new THREE.Mesh(new THREE.PlaneGeometry(7,7), new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));
    flag.position.set(-1,16,0.06); g.add(flag);
    g.position.set(60,-1.2,-10); g.rotation.y=-0.5; world.add(g); addCollider(60,-10,9);
  })();

  // signpost
  (function(){
    var x=6,z=10; var g=new THREE.Group();
    var post=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,3,8), new THREE.MeshStandardMaterial({color:0x7a4a22})); post.position.y=1.5; g.add(post);
    var cv=document.createElement('canvas'); cv.width=256; cv.height=128; var cx=cv.getContext('2d');
    cx.fillStyle='#e3c178'; cx.fillRect(0,0,256,128); cx.strokeStyle='#7a4a22'; cx.lineWidth=8; cx.strokeRect(4,4,248,120);
    cx.fillStyle='#5a3210'; cx.font='bold 26px sans-serif'; cx.textAlign='center';
    cx.fillText('FOOSHA VILLAGE',128,50); cx.font='18px sans-serif'; cx.fillText('Explore & find',128,80); cx.fillText('the treasure!',128,102);
    var board=new THREE.Mesh(new THREE.PlaneGeometry(3.4,1.7), new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(cv), side:THREE.DoubleSide}));
    board.position.y=3.2; g.add(board);
    g.position.set(x,groundHeight(x,z),z); world.add(g); addCollider(x,z,.6);
  })();

  // ---------- Treasure ----------
  var coins=[]; var collected=0;
  var coinGeo=new THREE.CylinderGeometry(.7,.7,.18,18);
  var coinMat=new THREE.MeshStandardMaterial({color:0xffd23f, metalness:.6, roughness:.25, emissive:0x6b4e00, emissiveIntensity:.3});
  function spawnTreasure(x,z){
    var g=new THREE.Group();
    var base=new THREE.Mesh(new THREE.BoxGeometry(1.6,1,1.1), new THREE.MeshStandardMaterial({color:0x6b3d1f})); base.position.y=.5; g.add(base);
    var lid=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.6,12,1,false,0,Math.PI), new THREE.MeshStandardMaterial({color:0x8a5a2b})); lid.rotation.z=Math.PI/2; lid.position.y=1; g.add(lid);
    var band=new THREE.Mesh(new THREE.BoxGeometry(1.65,.18,1.15), new THREE.MeshStandardMaterial({color:0xf1c40f,metalness:.6,roughness:.3})); band.position.y=.5; g.add(band);
    g.position.set(x, groundHeight(x,z), z); g.castShadow=true; world.add(g);
    var coin=new THREE.Mesh(coinGeo, coinMat); coin.position.set(x, groundHeight(x,z)+2.4, z); coin.castShadow=true; world.add(coin);
    coins.push({coin:coin, lid:lid, x:x, z:z, got:false, baseY:groundHeight(x,z)+2.4});
  }
  for (var t1=0;t1<10;t1++){ var ta=Math.random()*Math.PI*2, tr=12+Math.random()*(ISLAND_R-22); spawnTreasure(Math.cos(ta)*tr, Math.sin(ta)*tr); }
  document.getElementById('total').textContent = coins.length;

  // ============================================================
  //  LUFFY
  // ============================================================
  var luffy = new THREE.Group();
  var skin = new THREE.MeshStandardMaterial({color:0xf2b48a, roughness:.9});
  var red  = new THREE.MeshStandardMaterial({color:0xd6332a, roughness:.8});
  var blue = new THREE.MeshStandardMaterial({color:0x2c5fa8, roughness:.8});
  var dark = new THREE.MeshStandardMaterial({color:0x2b2b2b, roughness:.9});
  var strawY = new THREE.MeshStandardMaterial({color:0xf4d03f, roughness:.9});

  var torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.62,0.9,4,12), red);
  torso.position.y=2.05; torso.castShadow=true; luffy.add(torso);
  var belly = new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.2), skin); belly.position.set(0,1.7,.55); luffy.add(belly);

  var headGrp = new THREE.Group(); headGrp.position.y=3.15; luffy.add(headGrp);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.62,16,14), skin); head.castShadow=true; headGrp.add(head);
  var hair = new THREE.Mesh(new THREE.SphereGeometry(0.66,16,12,0,Math.PI*2,0,Math.PI/2), dark); hair.position.y=.12; hair.scale.y=.8; headGrp.add(hair);
  var eyeW=new THREE.MeshStandardMaterial({color:0xffffff});
  [-.24,.24].forEach(function(ex){
    var e=new THREE.Mesh(new THREE.SphereGeometry(.13,10,10),eyeW); e.position.set(ex,.05,.52); e.scale.z=.5; headGrp.add(e);
    var pu=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),dark); pu.position.set(ex,.04,.62); headGrp.add(pu);
  });
  var smile=new THREE.Mesh(new THREE.TorusGeometry(.2,.04,8,16,Math.PI), new THREE.MeshStandardMaterial({color:0x7a2b22}));
  smile.position.set(0,-.22,.5); smile.rotation.x=Math.PI*0.5; smile.rotation.z=Math.PI; headGrp.add(smile);
  var scarMat=new THREE.MeshStandardMaterial({color:0xb5563f});
  var scA=new THREE.Mesh(new THREE.BoxGeometry(.04,.18,.02),scarMat); scA.position.set(-.24,-.16,.55); headGrp.add(scA);
  var scB=new THREE.Mesh(new THREE.BoxGeometry(.16,.04,.02),scarMat); scB.position.set(-.24,-.1,.55); headGrp.add(scB);

  var hatGrp=new THREE.Group(); hatGrp.position.y=.55; headGrp.add(hatGrp);
  hatGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,.08,20), strawY));
  var crown=new THREE.Mesh(new THREE.CylinderGeometry(.55,.62,.5,18), strawY); crown.position.y=.28; hatGrp.add(crown);
  var hatband=new THREE.Mesh(new THREE.CylinderGeometry(.57,.63,.16,18), red); hatband.position.y=.16; hatGrp.add(hatband);

  function makeArm(side){
    var grp=new THREE.Group(); grp.position.set(side*0.78,2.55,0);
    var upper=new THREE.Mesh(new THREE.CapsuleGeometry(.2,.7,4,8), red); upper.position.y=-.4; grp.add(upper);
    var fore=new THREE.Mesh(new THREE.CapsuleGeometry(.18,.7,4,8), skin); fore.position.y=-1.1; grp.add(fore);
    var hand=new THREE.Mesh(new THREE.SphereGeometry(.22,10,10), skin); hand.position.y=-1.55; grp.add(hand);
    grp.traverse(function(o){o.castShadow=true;}); luffy.add(grp); return grp;
  }
  var armL=makeArm(-1), armR=makeArm(1);

  function makeLeg(side){
    var grp=new THREE.Group(); grp.position.set(side*0.3,1.45,0);
    var thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.24,.6,4,8), blue); thigh.position.y=-.45; grp.add(thigh);
    var shin=new THREE.Mesh(new THREE.CapsuleGeometry(.2,.55,4,8), skin); shin.position.y=-1.1; grp.add(shin);
    var sandal=new THREE.Mesh(new THREE.BoxGeometry(.34,.2,.7), new THREE.MeshStandardMaterial({color:0x6b3d1f})); sandal.position.set(0,-1.5,.12); grp.add(sandal);
    grp.traverse(function(o){o.castShadow=true;}); luffy.add(grp); return grp;
  }
  var legL=makeLeg(-1), legR=makeLeg(1);

  luffy.position.set(0,0,28); scene.add(luffy);

  var player = { x:0, z:28, angle:Math.PI, speed:0, h:0, vy:0, jumping:false };
  var WALK=7, RUN=13;

  // ============================================================
  //  Floating D-Pad
  // ============================================================
  var joyEl=document.getElementById('joy'), stick=document.getElementById('stick');
  var joyActive=false, joyId=null, joyVec={x:0,y:0};
  var JOY_R=43;
  function joyStart(e){ var t=e.changedTouches?e.changedTouches[0]:e; joyActive=true; joyId=(t.identifier!=null?t.identifier:'m'); joyMove(e); }
  function joyMove(e){
    if(!joyActive) return;
    var t;
    if(e.changedTouches){ for(var ii=0;ii<e.changedTouches.length;ii++){ if(e.changedTouches[ii].identifier===joyId){t=e.changedTouches[ii];break;} } if(!t) return; }
    else t=e;
    var r=joyEl.getBoundingClientRect(); var cx=r.left+r.width/2, cy=r.top+r.height/2;
    var dx=t.clientX-cx, dy=t.clientY-cy; var len=Math.hypot(dx,dy)||1;
    var cl=Math.min(len,JOY_R); dx=dx/len*cl; dy=dy/len*cl;
    stick.style.transform='translate('+dx+'px,'+dy+'px)';
    joyVec.x=dx/JOY_R; joyVec.y=dy/JOY_R;
    if(e.cancelable) e.preventDefault();
  }
  function joyEnd(e){
    if(e.changedTouches){ var found=false; for(var ii=0;ii<e.changedTouches.length;ii++){ if(e.changedTouches[ii].identifier===joyId) found=true; } if(!found) return; }
    joyActive=false; joyVec.x=joyVec.y=0; stick.style.transform='translate(0,0)';
  }
  joyEl.addEventListener('touchstart', joyStart, {passive:false});
  window.addEventListener('touchmove', joyMove, {passive:false});
  window.addEventListener('touchend', joyEnd);
  window.addEventListener('touchcancel', joyEnd);
  joyEl.addEventListener('mousedown', joyStart);
  window.addEventListener('mousemove', function(e){ if(joyActive&&joyId==='m') joyMove(e); });
  window.addEventListener('mouseup', function(){ if(joyId==='m'){ joyActive=false; joyVec.x=joyVec.y=0; stick.style.transform='translate(0,0)'; } });

  var running=false;
  function press(el,on,off){
    el.addEventListener('touchstart',function(e){ if(e.cancelable) e.preventDefault(); on(); },{passive:false});
    el.addEventListener('touchend',function(e){ if(e.cancelable) e.preventDefault(); if(off) off(); },{passive:false});
    el.addEventListener('mousedown',on); el.addEventListener('mouseup',function(){ if(off) off(); }); el.addEventListener('mouseleave',function(){ if(off) off(); });
  }
  press(document.getElementById('runBtn'), function(){running=true;}, function(){running=false;});
  press(document.getElementById('jumpBtn'), function(){ if(!player.jumping){ player.jumping=true; player.vy=9.2; toast("Gomu Gomu Jump!"); } });

  var keys={};
  window.addEventListener('keydown',function(e){ keys[e.key.toLowerCase()]=true; if(e.key===' '&&!player.jumping){player.jumping=true;player.vy=9.2;} });
  window.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });

  var toastEl=document.getElementById('toast'); var toastT;
  function toast(msg, ms){ ms=ms||1600; toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('show');},ms); }

  // ============================================================
  //  Loop
  // ============================================================
  var clock=new THREE.Clock();
  var walkPhase=0;
  var camPos=new THREE.Vector3(0,8,40);
  var tmp=new THREE.Vector3();
  var loopErrShown=false;

  function tryMove(nx,nz){
    var d=Math.hypot(nx,nz);
    if(d>ISLAND_R-8){ var a=Math.atan2(nz,nx); nx=Math.cos(a)*(ISLAND_R-8); nz=Math.sin(a)*(ISLAND_R-8); }
    for(var ci=0;ci<colliders.length;ci++){ var c=colliders[ci]; var dx=nx-c.x, dz=nz-c.z; var dd=Math.hypot(dx,dz); var mn=c.r+0.7; if(dd<mn){ var aa=Math.atan2(dz,dx); nx=c.x+Math.cos(aa)*mn; nz=c.z+Math.sin(aa)*mn; } }
    player.x=nx; player.z=nz;
  }

  function frame(){
    var dt=Math.min(clock.getDelta(),0.05);
    var tt=clock.elapsedTime;

    var ix=joyVec.x, iy=joyVec.y;
    if(keys['w']||keys['arrowup']) iy=-1; if(keys['s']||keys['arrowdown']) iy=1;
    if(keys['a']||keys['arrowleft']) ix=-1; if(keys['d']||keys['arrowright']) ix=1;
    var mag=Math.min(1,Math.hypot(ix,iy));
    var isRun = running || keys['shift'];

    if(mag>0.12){
      var camYaw=Math.atan2(camera.position.x-player.x, camera.position.z-player.z);
      var moveAngle=Math.atan2(ix, -iy) + camYaw + Math.PI;
      var targetSpeed=(isRun?RUN:WALK)*mag;
      player.speed += (targetSpeed-player.speed)*0.2;
      var da=((moveAngle-player.angle+Math.PI*3)%(Math.PI*2))-Math.PI;
      player.angle += da*Math.min(1,dt*12);
      tryMove(player.x+Math.sin(player.angle)*player.speed*dt, player.z+Math.cos(player.angle)*player.speed*dt);
    } else {
      player.speed += (0-player.speed)*0.2;
    }

    if(player.jumping){ player.h+=player.vy*dt; player.vy-=24*dt; if(player.h<=0){ player.h=0; player.jumping=false; player.vy=0; } }
    var gh=groundHeight(player.x,player.z);
    luffy.position.set(player.x, gh+player.h, player.z);
    luffy.rotation.y=player.angle;

    var moving=player.speed>0.5;
    walkPhase += dt*(player.speed*0.9+(moving?2:0));
    var swv=moving?Math.sin(walkPhase*2)*0.9*Math.min(1,player.speed/RUN+0.4):0;
    legL.rotation.x= swv; legR.rotation.x=-swv;
    armL.rotation.x=-swv*0.8; armR.rotation.x= swv*0.8;
    torso.rotation.x = moving? 0.12 : Math.sin(tt*1.5)*0.03;
    headGrp.position.y = 3.15 + (moving?Math.abs(Math.sin(walkPhase*2))*0.06:Math.sin(tt*1.5)*0.02);
    hatGrp.rotation.z = Math.sin(walkPhase*2)*0.06*(moving?1:0);

    var camDist=12, camHeight=7;
    tmp.set(player.x - Math.sin(player.angle)*camDist, gh + camHeight + player.h*0.4, player.z - Math.cos(player.angle)*camDist);
    camPos.lerp(tmp, 1-Math.pow(0.001,dt));
    camera.position.copy(camPos);
    camera.lookAt(player.x, gh+2.4+player.h*0.5, player.z);

    sun.position.set(player.x+40, 70, player.z+30);
    sun.target.position.set(player.x, 0, player.z);

    var arr=oceanGeo.attributes.position.array;
    for(var oi=0;oi<arr.length;oi+=3){ var ox=oBase[oi], oz=oBase[oi+2]; arr[oi+1]=Math.sin(ox*0.05+tt*1.2)*0.5+Math.cos(oz*0.05+tt*0.9)*0.5; }
    oceanGeo.attributes.position.needsUpdate=true;

    if(windmillHub) windmillHub.rotation.z += dt*1.2;

    for(var k=0;k<coins.length;k++){ var co=coins[k]; if(co.got) continue;
      co.coin.rotation.y += dt*2.5; co.coin.position.y = co.baseY + Math.sin(tt*2+co.x)*0.2;
      if(Math.hypot(player.x-co.x, player.z-co.z)<1.8){
        co.got=true; collected++; document.getElementById('coins').textContent=collected;
        world.remove(co.coin); co.lid.rotation.z=Math.PI*0.7;
        if(collected===coins.length){ toast("🏴‍☠️ You found ALL the treasure! King of the Pirates!",3500); document.getElementById('hint').textContent="Adventure complete — keep exploring!"; }
        else toast("🪙 Treasure! ("+collected+"/"+coins.length+")");
      }
    }

    renderer.render(scene,camera);
  }

  function animate(){
    requestAnimationFrame(animate);
    try { frame(); }
    catch(err){ if(!loopErrShown){ loopErrShown=true; window.__err('LOOP', (err && err.stack) || err); } }
  }

  // boot
  resize();
  clearInterval(fakeLoad); barfill.style.width='100%';
  setTimeout(function(){ loaderEl.style.opacity='0'; setTimeout(function(){ if(loaderEl && loaderEl.parentNode) loaderEl.parentNode.removeChild(loaderEl); },600); toast("Welcome to the Grand Line, Luffy!",2600); }, 500);
  animate();
})();
</script>
</body>
</html>
